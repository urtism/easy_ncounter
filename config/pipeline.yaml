project:
  name: example_ncounter_project

inputs:
  counts: data/raw/counts.csv
  metadata: data/metadata/samples.csv
  probe_annotation: data/reference/probes.csv

outputs:
  results_dir: results
  reports_dir: reports

analysis:
  group_column: condition
  group_columns:
    - condition
  reference_group: control
  case_group: treated
  contrasts:
    - comparison_id: treated_vs_control
      reference_group: control
      case_group: treated
  min_count: 10
  min_samples: 2
  top_variable_genes: 50

normalization:
  method: nanostringnorm
  positive_control_norm: geometric_mean
  housekeeping_norm: geometric_mean
  background_correction: mean_2sd
  housekeeping_genes: []
  geNorm_min_housekeepers: 2
  geNorm_max_housekeepers:

qc:
  qc_mode: easy_strict
  strict_exclusion: false

r:
  executable: Rscript
